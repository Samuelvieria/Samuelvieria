<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384" role="img" aria-label="Do sensor em campo ao painel: sensor, ingestao pelo TWBridge, broker MQTT e a plataforma TWMonitor sobre ThingsBoard PE, onde ficam as rule chains, os alarmes e os dashboards. Se a rede cai, as medicoes vao para uma fila em disco e sao reenviadas ao reconectar.">
