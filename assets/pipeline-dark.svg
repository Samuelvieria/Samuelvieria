<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Pipeline de telemetria: sensor em campo, ingestao, broker MQTT e dashboard. Quando a rede cai, as medicoes vao para uma fila em disco e sao reenviadas ao reconectar.">
<title>Do sensor em campo ao dashboard — com fila em disco quando a rede cai</title>
<rect width="1200" height="330" fill="#0B1219"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L9,5 L0,9.5 z" fill="#A2B1BD"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L9,5 L0,9.5 z" fill="#4FAECE"/></marker>
</defs>
<rect x="56" y="54" width="212" height="80" fill="#111C25" stroke="#243441" stroke-width="1"/>
<rect x="56" y="54" width="3" height="80" fill="#4FAECE"/>
<text x="76" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#E4EDF4">SENSOR</text>
<text x="76" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#637585">piezômetro · célula de carga</text>
<rect x="348" y="54" width="212" height="80" fill="#111C25" stroke="#243441" stroke-width="1"/>
<rect x="348" y="54" width="3" height="80" fill="#4FAECE"/>
<text x="368" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#E4EDF4">INGESTÃO</text>
<text x="368" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#637585">lê .dat → converte JSON</text>
<rect x="640" y="54" width="212" height="80" fill="#111C25" stroke="#243441" stroke-width="1"/>
<rect x="640" y="54" width="3" height="80" fill="#4FAECE"/>
<text x="660" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#E4EDF4">BROKER MQTT</text>
<text x="660" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#637585">TLS · porta 8883</text>
<rect x="932" y="54" width="212" height="80" fill="#111C25" stroke="#243441" stroke-width="1"/>
<rect x="932" y="54" width="3" height="80" fill="#4FAECE"/>
<text x="952" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#E4EDF4">THINGSBOARD</text>
<text x="952" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#637585">série temporal · painel</text>
<line x1="282" y1="94.0" x2="340" y2="94.0" stroke="#A2B1BD" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="311" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6" fill="#A2B1BD" text-anchor="middle">arquivo .dat</text>
<line x1="574" y1="94.0" x2="632" y2="94.0" stroke="#A2B1BD" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="603" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6" fill="#A2B1BD" text-anchor="middle">publica</text>
<line x1="866" y1="94.0" x2="924" y2="94.0" stroke="#A2B1BD" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="895" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6" fill="#A2B1BD" text-anchor="middle">grava série</text>
<rect x="494" y="216" width="212" height="68" fill="#111C25" stroke="#4FAECE" stroke-width="1" stroke-dasharray="4 3"/>
<text x="514" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4FAECE">FILA EM DISCO</text>
<text x="514" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#637585">nenhuma medição se perde</text>
<path d="M454.0,138 V250.0 H486" fill="none" stroke="#4FAECE" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ac)"/>
<text x="466.0" y="206.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#4FAECE">rede caiu</text>
<path d="M710,250.0 H746.0 V142" fill="none" stroke="#4FAECE" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ac)"/>
<text x="760.0" y="240.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#4FAECE">reenvia ao reconectar</text>
<line x1="56" y1="304" x2="1144" y2="304" stroke="#243441" stroke-width="1"/>
<text x="56" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.4" fill="#637585">TECWISE LINK — PYTHON · PAHO-MQTT · TLS · EMPACOTADO COMO INSTALADOR WINDOWS</text>
</svg>