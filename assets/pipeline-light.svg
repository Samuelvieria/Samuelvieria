<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Pipeline de telemetria: sensor em campo, ingestao, broker MQTT e dashboard. Quando a rede cai, as medicoes vao para uma fila em disco e sao reenviadas ao reconectar.">
<title>Do sensor em campo ao dashboard — com fila em disco quando a rede cai</title>
<rect width="1200" height="330" fill="#F1F4F7"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L9,5 L0,9.5 z" fill="#48565F"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L9,5 L0,9.5 z" fill="#0B6B8F"/></marker>
</defs>
<rect x="56" y="54" width="212" height="80" fill="#FFFFFF" stroke="#D3DBE3" stroke-width="1"/>
<rect x="56" y="54" width="3" height="80" fill="#0B6B8F"/>
<text x="76" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#111A24">SENSOR</text>
<text x="76" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8494A1">piezômetro · célula de carga</text>
<rect x="348" y="54" width="212" height="80" fill="#FFFFFF" stroke="#D3DBE3" stroke-width="1"/>
<rect x="348" y="54" width="3" height="80" fill="#0B6B8F"/>
<text x="368" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#111A24">INGESTÃO</text>
<text x="368" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8494A1">lê .dat → converte JSON</text>
<rect x="640" y="54" width="212" height="80" fill="#FFFFFF" stroke="#D3DBE3" stroke-width="1"/>
<rect x="640" y="54" width="3" height="80" fill="#0B6B8F"/>
<text x="660" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#111A24">BROKER MQTT</text>
<text x="660" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8494A1">TLS · porta 8883</text>
<rect x="932" y="54" width="212" height="80" fill="#FFFFFF" stroke="#D3DBE3" stroke-width="1"/>
<rect x="932" y="54" width="3" height="80" fill="#0B6B8F"/>
<text x="952" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#111A24">THINGSBOARD</text>
<text x="952" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8494A1">série temporal · painel</text>
<line x1="282" y1="94.0" x2="340" y2="94.0" stroke="#48565F" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="311" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6" fill="#48565F" text-anchor="middle">arquivo .dat</text>
<line x1="574" y1="94.0" x2="632" y2="94.0" stroke="#48565F" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="603" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6" fill="#48565F" text-anchor="middle">publica</text>
<line x1="866" y1="94.0" x2="924" y2="94.0" stroke="#48565F" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="895" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6" fill="#48565F" text-anchor="middle">grava série</text>
<rect x="494" y="216" width="212" height="68" fill="#FFFFFF" stroke="#0B6B8F" stroke-width="1" stroke-dasharray="4 3"/>
<text x="514" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#0B6B8F">FILA EM DISCO</text>
<text x="514" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8494A1">nenhuma medição se perde</text>
